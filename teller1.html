<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TAJ - Teller 1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#eef5f9;
    font-family:Arial,Helvetica,sans-serif;
    color:#062d5c;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.panel{
    width:100%;
    max-width:850px;
    min-height:650px;
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 15px 45px rgba(0,0,0,.18);
}

.header{
    background:#003b73;
    color:#fff;
    padding:32px 40px;
    border-bottom:10px solid #fed100;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.taj{
    font-size:42px;
    font-weight:900;
}

.teller-name{
    font-size:32px;
    font-weight:900;
}

.connection{
    padding:14px 25px;
    background:#dce8ef;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}

.connection.live{
    background:#dff5df;
    color:#08752e;
}

.connection.offline{
    background:#ffe1e1;
    color:#a00000;
}

.content{
    padding:45px;
}

.label{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#567;
}

.current-number{
    margin-top:15px;
    text-align:center;
    font-size:120px;
    line-height:1;
    font-weight:900;
    color:#003b73;
}

.current-service{
    min-height:70px;
    margin-top:15px;
    text-align:center;
    font-size:24px;
    line-height:1.3;
    font-weight:bold;
}

.buttons{
    margin-top:40px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

button{
    border:none;
    border-radius:18px;
    min-height:90px;
    padding:18px;
    font-size:23px;
    font-weight:900;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.next{
    grid-column:1 / 3;
    background:#009b3a;
    color:#fff;
    min-height:115px;
    font-size:30px;
}

.recall{
    background:#fed100;
    color:#002f61;
}

.complete{
    background:#003b73;
    color:#fff;
}

.message{
    min-height:35px;
    margin-top:25px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#555;
}
</style>
</head>

<body>

<div class="panel">

    <div class="header">
        <div class="taj">TAJ</div>
        <div class="teller-name">TELLER 1</div>
    </div>

    <div id="connection" class="connection">
        CONNECTING TO LIVE QUEUE...
    </div>

    <div class="content">

        <div class="label">CURRENT CUSTOMER</div>

        <div id="currentNumber" class="current-number">
            ---
        </div>

        <div id="currentService" class="current-service">
            No customer currently assigned.
        </div>

        <div class="buttons">

            <button id="nextButton" class="next" type="button">
                NEXT CUSTOMER
            </button>

            <button id="recallButton" class="recall" type="button">
                RECALL CUSTOMER
            </button>

            <button id="completeButton" class="complete" type="button">
                COMPLETE
            </button>

        </div>

        <div id="message" class="message"></div>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {
    apiKey:"AIzaSyCJAEZ-MD-W6SQZfUS5BkD-4NpT11vItHE",
    authDomain:"jamaica-take-a-ticket.firebaseapp.com",
    databaseURL:"https://jamaica-take-a-ticket-default-rtdb.firebaseio.com",
    projectId:"jamaica-take-a-ticket",
    storageBucket:"jamaica-take-a-ticket.firebasestorage.app",
    messagingSenderId:"1093598545752",
    appId:"1:1093598545752:web:7fa81726e2bcc5fdfb072d"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const TELLER_NUMBER = 1;

const connection =
    document.getElementById("connection");

const currentNumber =
    document.getElementById("currentNumber");

const currentService =
    document.getElementById("currentService");

const message =
    document.getElementById("message");

const nextButton =
    document.getElementById("nextButton");

const recallButton =
    document.getElementById("recallButton");

const completeButton =
    document.getElementById("completeButton");


let currentTicket = null;
let currentQueueKey = null;
let connected = false;
let actionLock = false;


/* ==========================================
   CONNECTION
========================================== */

onValue(
    ref(db,".info/connected"),
    function(snapshot){

        connected = snapshot.val() === true;

        if(connected){

            connection.textContent =
                "LIVE QUEUE CONNECTED";

            connection.className =
                "connection live";

        }else{

            connection.textContent =
                "QUEUE CONNECTION LOST";

            connection.className =
                "connection offline";
        }

        updateButtons();
    }
);


/* ==========================================
   RESTORE TELLER
========================================== */

onValue(
    ref(db,"tellers/teller1"),
    function(snapshot){

        const data = snapshot.val();

        if(data && data.number){

            currentTicket = data;
            currentQueueKey = data.queueKey || null;

            currentNumber.textContent =
                data.number;

            currentService.textContent =
                data.service || "";

        }else{

            currentTicket = null;
            currentQueueKey = null;

            currentNumber.textContent = "---";

            currentService.textContent =
                "No customer currently assigned.";
        }

        updateButtons();
    }
);


/* ==========================================
   BUTTON STATES
========================================== */

function updateButtons(){

    if(!connected){

        nextButton.disabled = true;
        recallButton.disabled = true;
        completeButton.disabled = true;

        return;
    }

    if(currentTicket){

        nextButton.disabled = true;
        recallButton.disabled = false;
        completeButton.disabled = false;

    }else{

        nextButton.disabled = false;
        recallButton.disabled = true;
        completeButton.disabled = true;
    }
}


/* ==========================================
   FIND OLDEST WAITING CUSTOMER
========================================== */

async function findNextWaitingCustomer(){

    const snapshot =
        await get(ref(db,"queue"));

    if(!snapshot.exists()){
        return null;
    }

    const waiting = [];

    snapshot.forEach(function(child){

        const ticket = child.val();

        if(
            ticket &&
            ticket.status === "waiting"
        ){

            waiting.push({
                key:child.key,
                ...ticket
            });
        }
    });


    if(waiting.length === 0){
        return null;
    }


    waiting.sort(function(a,b){

        return (
            Number(a.createdAt) || 0
        ) -
        (
            Number(b.createdAt) || 0
        );
    });


    return waiting[0];
}


/* ==========================================
   NEXT CUSTOMER
========================================== */

async function getNextCustomer(){

    if(!connected){

        message.textContent =
            "Queue connection unavailable.";

        return;
    }


    if(currentTicket){

        message.textContent =
            "Complete the current customer first.";

        return;
    }


    message.textContent =
        "Checking queue...";


    try{

        const ticket =
            await findNextWaitingCustomer();


        if(!ticket){

            message.textContent =
                "No customers waiting.";

            return;
        }


        const calledAt =
            Date.now();


        /*
         Change the actual queue record
         from WAITING to CALLED.
        */

        await update(
            ref(
                db,
                "queue/" + ticket.key
            ),
            {
                status:"called",
                teller:TELLER_NUMBER,
                calledAt:calledAt
            }
        );


        const tellerData = {

            number:
                ticket.number,

            prefix:
                ticket.prefix || "",

            service:
                ticket.service || "",

            queueKey:
                ticket.key,

            teller:
                TELLER_NUMBER,

            calledAt:
                calledAt
        };


        /*
         Assign customer to Teller 1.
        */

        await set(
            ref(
                db,
                "tellers/teller1"
            ),
            tellerData
        );


        /*
         Send customer to waiting display.
        */

        await set(
            ref(
                db,
                "display/current"
            ),
            tellerData
        );


        /*
         Add to display history.
        */

        await push(
            ref(
                db,
                "display/history"
            ),
            tellerData
        );


        message.textContent =
            ticket.number +
            " called.";

    }
    catch(error){

        console.error(
            "NEXT CUSTOMER ERROR:",
            error
        );

        message.textContent =
            "Unable to call customer.";
    }
}


/* ==========================================
   RECALL
========================================== */

async function recallCustomer(){

    if(!currentTicket){

        message.textContent =
            "No customer to recall.";

        return;
    }


    try{

        const recallData = {

            ...currentTicket,

            teller:
                TELLER_NUMBER,

            recalledAt:
                Date.now()
        };


        await set(
            ref(
                db,
                "display/current"
            ),
            recallData
        );


        await push(
            ref(
                db,
                "display/history"
            ),
            recallData
        );


        message.textContent =
            currentTicket.number +
            " recalled.";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Unable to recall customer.";
    }
}


/* ==========================================
   COMPLETE
========================================== */

async function completeCustomer(){

    if(!currentTicket){

        message.textContent =
            "No customer to complete.";

        return;
    }


    try{

        const completedNumber =
            currentTicket.number;


        if(currentQueueKey){

            await update(
                ref(
                    db,
                    "queue/" +
                    currentQueueKey
                ),
                {
                    status:"complete",
                    completedAt:Date.now()
                }
            );
        }


        await set(
            ref(
                db,
                "tellers/teller1"
            ),
            null
        );


        currentTicket = null;
        currentQueueKey = null;

        currentNumber.textContent = "---";

        currentService.textContent =
            "No customer currently assigned.";

        message.textContent =
            completedNumber +
            " completed.";

        updateButtons();

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Unable to complete customer.";
    }
}


/* ==========================================
   BUTTON CONTROL
========================================== */

async function runAction(action){

    if(actionLock){
        return;
    }

    actionLock = true;

    try{

        await action();

    }finally{

        setTimeout(function(){
            actionLock = false;
        },350);
    }
}


nextButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        runAction(getNextCustomer);
    }
);


recallButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        runAction(recallCustomer);
    }
);


completeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        runAction(completeCustomer);
    }
);


/* ==========================================
   PREVENT LONG PRESS
========================================== */

document.addEventListener(
    "contextmenu",
    function(event){
        event.preventDefault();
    }
);

document.addEventListener(
    "selectstart",
    function(event){
        event.preventDefault();
    }
);

</script>

</body>
</html>
