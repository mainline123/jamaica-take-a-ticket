<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TAJ - Teller 1</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#eef5f9;
    font-family:Arial,Helvetica,sans-serif;
    color:#062d5c;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:25px;
}

.panel{
    width:100%;
    max-width:750px;

    background:#fff;

    border-radius:30px;

    overflow:hidden;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.18);
}

.header{
    background:#003b73;
    color:#fff;

    text-align:center;

    padding:35px 25px;

    border-bottom:10px solid #fed100;
}

.taj{
    font-size:32px;
    font-weight:900;
}

.header h1{
    margin-top:10px;

    font-size:58px;
    font-weight:900;
}

.status{
    padding:22px;

    text-align:center;

    background:#e8f7ec;

    color:#006b37;

    font-size:20px;
    font-weight:bold;
}

.current{
    padding:45px 25px;

    text-align:center;
}

.current-label{
    font-size:24px;

    font-weight:bold;

    color:#666;
}

#currentNumber{
    margin-top:15px;

    font-size:115px;

    line-height:1;

    font-weight:900;

    color:#003b73;
}

.current-service{
    margin-top:15px;

    min-height:30px;

    font-size:22px;

    color:#555;
}

.controls{
    padding:
        0 40px 45px;

    display:grid;

    gap:20px;
}

button{
    width:100%;

    min-height:95px;

    border:none;

    border-radius:20px;

    font-size:30px;

    font-weight:900;

    cursor:pointer;

    touch-action:manipulation;
}

.next{
    background:#009b3a;

    color:#fff;

    box-shadow:
        0 8px 18px
        rgba(0,100,40,.25);
}

.recall{
    background:#fed100;

    color:#062d5c;
}

.complete{
    background:#003b73;

    color:#fff;
}

button:active{
    opacity:.85;
}

#message{
    min-height:55px;

    padding:
        0 30px 30px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    color:#555;
}

.footer{
    padding:22px;

    text-align:center;

    background:#002e5d;

    color:#fff;

    font-size:17px;
}

</style>
</head>

<body>

<div class="panel">

    <header class="header">

        <div class="taj">
            TAX ADMINISTRATION JAMAICA
        </div>

        <h1>
            TELLER 1
        </h1>

    </header>


    <div
        id="connectionStatus"
        class="status">

        CONNECTING TO QUEUE...

    </div>


    <section class="current">

        <div class="current-label">
            CURRENT CUSTOMER
        </div>

        <div id="currentNumber">
            ---
        </div>

        <div
            id="currentService"
            class="current-service">

            No customer currently called

        </div>

    </section>


    <section class="controls">

        <button
            id="nextButton"
            class="next">

            NEXT CUSTOMER

        </button>


        <button
            id="recallButton"
            class="recall">

            RECALL CUSTOMER

        </button>


        <button
            id="completeButton"
            class="complete">

            COMPLETE

        </button>

    </section>


    <div id="message">
        Ready
    </div>


    <footer class="footer">

        Serving You • Building Jamaica

    </footer>

</div>



<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCJAEZ-MD-W6SQZfUS5BkD-4NpT11vItHE",

    authDomain:
    "jamaica-take-a-ticket.firebaseapp.com",

    databaseURL:
    "https://jamaica-take-a-ticket-default-rtdb.firebaseio.com",

    projectId:
    "jamaica-take-a-ticket",

    storageBucket:
    "jamaica-take-a-ticket.firebasestorage.app",

    messagingSenderId:
    "1093598545752",

    appId:
    "1:1093598545752:web:7fa81726e2bcc5fdfb072d"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);



/* =====================================================
   ELEMENTS
===================================================== */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const currentNumberElement =
    document.getElementById(
        "currentNumber"
    );


const currentServiceElement =
    document.getElementById(
        "currentService"
    );


const message =
    document.getElementById(
        "message"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const recallButton =
    document.getElementById(
        "recallButton"
    );


const completeButton =
    document.getElementById(
        "completeButton"
    );



/* =====================================================
   CURRENT TELLER
===================================================== */

const TELLER_NUMBER = 1;

let currentTicket = null;



/* =====================================================
   FIREBASE CONNECTION STATUS
===================================================== */

const connectedRef =
    ref(
        db,
        ".info/connected"
    );


onValue(
    connectedRef,
    function(snapshot){

        if(
            snapshot.val() === true
        ){

            connectionStatus.textContent =
                "LIVE QUEUE CONNECTED";

            connectionStatus.style.background =
                "#e8f7ec";

            connectionStatus.style.color =
                "#006b37";

        }
        else{

            connectionStatus.textContent =
                "CONNECTING TO QUEUE...";

            connectionStatus.style.background =
                "#fff3cd";

            connectionStatus.style.color =
                "#7a5b00";

        }

    }
);



/* =====================================================
   LISTEN FOR TELLER 1 CURRENT CUSTOMER
===================================================== */

const tellerRef =
    ref(
        db,
        "tellers/teller1"
    );


onValue(
    tellerRef,
    function(snapshot){

        const data =
            snapshot.val();


        if(
            data &&
            data.number
        ){

            currentTicket =
                data;


            currentNumberElement.textContent =
                data.number;


            currentServiceElement.textContent =
                data.service ||
                "Customer service";

        }
        else{

            currentTicket =
                null;


            currentNumberElement.textContent =
                "---";


            currentServiceElement.textContent =
                "No customer currently called";

        }

    }
);



/* =====================================================
   FIND NEXT WAITING CUSTOMER

   For our FIRST LIVE TEST, if the kiosk has not yet
   been connected to Firebase, this will create a
   temporary T001 test customer.

   Once the kiosk is connected, Teller 1 will pull
   the oldest WAITING ticket from Firebase instead.
===================================================== */

async function getNextCustomer(){

    message.textContent =
        "Checking queue...";


    const queueRef =
        ref(
            db,
            "queue"
        );


    const snapshot =
        await get(
            queueRef
        );


    const queue =
        snapshot.val();


    let nextTicket = null;

    let nextKey = null;


    if(queue){

        const entries =
            Object.entries(queue);


        entries.sort(
            function(a,b){

                const timeA =
                    a[1].createdAt || 0;

                const timeB =
                    b[1].createdAt || 0;

                return timeA - timeB;

            }
        );


        for(
            const [key,ticket]
            of entries
        ){

            if(
                ticket.status ===
                "waiting"
            ){

                nextKey =
                    key;

                nextTicket =
                    ticket;

                break;

            }

        }

    }


    /*
       TEMPORARY FIRST TEST CUSTOMER
    */

    if(!nextTicket){

        nextTicket = {

            number:"T001",

            prefix:"T",

            service:
            "Traffic Ticket Payments",

            status:"waiting",

            createdAt:
            Date.now()

        };


        const newTicketRef =
            push(
                queueRef
            );


        nextKey =
            newTicketRef.key;


        await set(
            newTicketRef,
            nextTicket
        );

    }


    await callCustomer(
        nextKey,
        nextTicket
    );

}



/* =====================================================
   CALL CUSTOMER
===================================================== */

async function callCustomer(
    queueKey,
    ticket
){

    const calledAt =
        Date.now();


    const callData = {

        number:
            ticket.number,

        prefix:
            ticket.prefix || "",

        service:
            ticket.service || "",

        teller:
            TELLER_NUMBER,

        queueKey:
            queueKey,

        calledAt:
            calledAt

    };


    /*
       Update queue ticket
    */

    await update(
        ref(
            db,
            "queue/" + queueKey
        ),
        {

            status:
                "called",

            teller:
                TELLER_NUMBER,

            calledAt:
                calledAt

        }
    );


    /*
       Store Teller 1 current customer
    */

    await set(
        ref(
            db,
            "tellers/teller1"
        ),
        callData
    );


    /*
       Update main Now Serving display
    */

    await set(
        ref(
            db,
            "display/current"
        ),
        callData
    );


    /*
       Add call to history
    */

    await push(
        ref(
            db,
            "display/history"
        ),
        callData
    );


    message.textContent =
        ticket.number +
        " called to Teller 1";

}



/* =====================================================
   RECALL CURRENT CUSTOMER
===================================================== */

async function recallCustomer(){

    if(!currentTicket){

        message.textContent =
            "No customer to recall";

        return;

    }


    const recalledAt =
        Date.now();


    const callData = {

        ...currentTicket,

        teller:
            TELLER_NUMBER,

        recalledAt:
            recalledAt

    };


    await set(
        ref(
            db,
            "display/current"
        ),
        callData
    );


    await push(
        ref(
            db,
            "display/history"
        ),
        callData
    );


    message.textContent =
        currentTicket.number +
        " recalled";

}



/* =====================================================
   COMPLETE CURRENT CUSTOMER
===================================================== */

async function completeCustomer(){

    if(!currentTicket){

        message.textContent =
            "No current customer";

        return;

    }


    if(
        currentTicket.queueKey
    ){

        await update(
            ref(
                db,
                "queue/" +
                currentTicket.queueKey
            ),
            {

                status:
                    "complete",

                completedAt:
                    Date.now()

            }
        );

    }


    const finishedNumber =
        currentTicket.number;


    await set(
        ref(
            db,
            "tellers/teller1"
        ),
        null
    );


    currentTicket =
        null;


    message.textContent =
        finishedNumber +
        " completed";

}



/* =====================================================
   FAST TOUCH BUTTONS
===================================================== */

let touchLock = false;


function fastAction(
    button,
    action
){

    button.addEventListener(
        "pointerdown",
        async function(event){

            event.preventDefault();


            if(touchLock){
                return;
            }


            touchLock = true;


            try{

                await action();

            }
            catch(error){

                console.error(error);

                message.textContent =
                    "Queue connection error";

            }


            setTimeout(
                function(){

                    touchLock = false;

                },
                400
            );

        },
        {
            passive:false
        }
    );

}


fastAction(
    nextButton,
    getNextCustomer
);


fastAction(
    recallButton,
    recallCustomer
);


fastAction(
    completeButton,
    completeCustomer
);



/* =====================================================
   BLOCK LONG-PRESS / COPY
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);


document.addEventListener(
    "selectstart",
    function(event){

        event.preventDefault();

    }
);

</script>

</body>
</html>
