<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TAJ - Teller 1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#eef5f9;
    font-family:Arial,Helvetica,sans-serif;
    color:#062d5c;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.panel{
    width:100%;
    max-width:850px;
    min-height:650px;
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 15px 45px rgba(0,0,0,.18);
}

.header{
    background:#003b73;
    color:#fff;
    padding:32px 40px;
    border-bottom:10px solid #fed100;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.taj{
    font-size:42px;
    font-weight:900;
}

.teller-name{
    font-size:32px;
    font-weight:900;
}

.connection{
    padding:14px 25px;
    background:#dce8ef;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}

.connection.live{
    background:#dff5df;
    color:#08752e;
}

.connection.offline{
    background:#ffe1e1;
    color:#a00000;
}

.content{
    padding:45px;
}

.label{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#567;
}

.current-number{
    margin-top:15px;
    text-align:center;
    font-size:120px;
    line-height:1;
    font-weight:900;
    color:#003b73;
}

.current-service{
    min-height:70px;
    margin-top:15px;
    text-align:center;
    font-size:24px;
    line-height:1.3;
    font-weight:bold;
}

.buttons{
    margin-top:40px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

button{
    border:none;
    border-radius:18px;
    min-height:90px;
    padding:18px;
    font-size:23px;
    font-weight:900;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.next{
    grid-column:1 / 3;
    background:#009b3a;
    color:#fff;
    min-height:115px;
    font-size:30px;
}

.recall{
    background:#fed100;
    color:#002f61;
}

.complete{
    background:#003b73;
    color:#fff;
}

.message{
    min-height:35px;
    margin-top:25px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#555;
}
</style>
</head>

<body>

<div class="panel">

    <div class="header">
        <div class="taj">TAJ</div>
        <div class="teller-name">TELLER 1</div>
    </div>

    <div id="connection" class="connection">
        CONNECTING TO LIVE QUEUE...
    </div>

    <div class="content">

        <div class="label">
            CURRENT CUSTOMER
        </div>

        <div id="currentNumber" class="current-number">
            ---
        </div>

        <div id="currentService" class="current-service">
            No customer currently assigned.
        </div>

        <div class="buttons">

            <button id="nextButton" class="next">
                NEXT CUSTOMER
            </button>

            <button id="recallButton" class="recall">
                RECALL CUSTOMER
            </button>

            <button id="completeButton" class="complete">
                COMPLETE
            </button>

        </div>

        <div id="message" class="message"></div>

    </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    update,
    push,
    onValue,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {
    apiKey:"AIzaSyCJAEZ-MD-W6SQZfUS5BkD-4NpT11vItHE",
    authDomain:"jamaica-take-a-ticket.firebaseapp.com",
    databaseURL:"https://jamaica-take-a-ticket-default-rtdb.firebaseio.com",
    projectId:"jamaica-take-a-ticket",
    storageBucket:"jamaica-take-a-ticket.firebasestorage.app",
    messagingSenderId:"1093598545752",
    appId:"1:1093598545752:web:7fa81726e2bcc5fdfb072d"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const TELLER_NUMBER = 1;

const connection =
    document.getElementById("connection");

const currentNumber =
    document.getElementById("currentNumber");

const currentService =
    document.getElementById("currentService");

const message =
    document.getElementById("message");

const nextButton =
    document.getElementById("nextButton");

const recallButton =
    document.getElementById("recallButton");

const completeButton =
    document.getElementById("completeButton");


let currentTicket = null;
let currentQueueKey = null;
let touchLock = false;
let connected = false;
let authenticated = false;
let authAttemptStarted = false;

/*
   LIVE LOCAL COPY OF FIREBASE QUEUE

   This avoids asking the NoviSign Android WebView
   to perform a fresh one-time get() when NEXT is pressed.
*/
let liveQueue = {};


/* =====================================================
   CONNECTION + AUTHENTICATION STATUS
===================================================== */

function updateAvailability(){

    const available =
        connected &&
        authenticated;

    if(available){

        connection.textContent =
            "LIVE QUEUE CONNECTED";

        connection.className =
            "connection live";

        nextButton.disabled = false;
        recallButton.disabled = false;
        completeButton.disabled = false;

    }else{

        if(!connected){

            connection.textContent =
                "QUEUE CONNECTION LOST";

        }else{

            connection.textContent =
                "AUTHENTICATING SECURE CONNECTION...";
        }

        connection.className =
            "connection offline";

        nextButton.disabled = true;
        recallButton.disabled = true;
        completeButton.disabled = true;
    }
}


onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            authenticated = true;

            console.log(
                "Firebase authenticated:",
                user.uid
            );

            updateAvailability();

            return;
        }

        authenticated = false;

        updateAvailability();

        if(authAttemptStarted){
            return;
        }

        authAttemptStarted = true;

        try{

            await signInAnonymously(auth);

        }catch(error){

            console.error(
                "Firebase authentication error:",
                error
            );

            authenticated = false;

            message.textContent =
                "Unable to authenticate secure connection.";

            updateAvailability();
        }
    }
);


onValue(
    ref(db,".info/connected"),
    function(snapshot){

        connected =
            snapshot.val() === true;

        updateAvailability();

        if(!connected){

            message.textContent =
                "Please wait for the queue connection to return.";
        }
    }
);


/* =====================================================
   LIVE QUEUE LISTENER
===================================================== */

onValue(
    ref(db,"queue"),
    function(snapshot){

        liveQueue =
            snapshot.val() || {};
    },
    function(error){

        console.error(
            "Queue listener error:",
            error
        );

        liveQueue = {};
    }
);


/* =====================================================
   RESTORE TELLER 1 STATE
===================================================== */

onValue(
    ref(db,"tellers/teller1"),
    function(snapshot){

        const data =
            snapshot.val();

        if(data && data.number){

            currentTicket = data;

            currentQueueKey =
                data.queueKey || null;

            currentNumber.textContent =
                data.number;

            currentService.textContent =
                data.service || "";

        }else{

            currentTicket = null;
            currentQueueKey = null;

            currentNumber.textContent =
                "---";

            currentService.textContent =
                "No customer currently assigned.";
        }
    }
);


/* =====================================================
   FIND WAITING CUSTOMERS FROM LIVE QUEUE
===================================================== */

function findWaitingCustomers(){

    const waiting = [];

    Object.keys(liveQueue).forEach(
        function(key){

            const ticket =
                liveQueue[key];

            if(
                ticket &&
                ticket.status === "waiting"
            ){

                waiting.push({
                    key:key,
                    ...ticket
                });
            }
        }
    );


    waiting.sort(
        function(a,b){

            return (
                a.createdAt || 0
            ) -
            (
                b.createdAt || 0
            );
        }
    );


    return waiting;
}


/* =====================================================
   ATOMICALLY CLAIM ONE CUSTOMER
===================================================== */

async function claimTicket(ticket){

    const ticketRef =
        ref(
            db,
            "queue/" + ticket.key
        );


    const result =
        await runTransaction(
            ticketRef,
            function(current){

                if(
                    current === null ||
                    current.status !== "waiting"
                ){
                    return;
                }


                return {
                    ...current,

                    status:"called",

                    teller:TELLER_NUMBER,

                    calledAt:Date.now()
                };
            },
            {
                applyLocally:false
            }
        );


    if(
        !result.committed ||
        !result.snapshot.exists()
    ){
        return null;
    }


    const claimed =
        result.snapshot.val();


    if(
        claimed.teller !== TELLER_NUMBER ||
        claimed.status !== "called"
    ){
        return null;
    }


    return {
        key:ticket.key,
        ...claimed
    };
}


/* =====================================================
   NEXT CUSTOMER
===================================================== */

async function getNextCustomer(){

    if(
        !connected ||
        !authenticated
    ){

        message.textContent =
            "Queue connection is unavailable.";

        return;
    }


    if(currentTicket){

        message.textContent =
            "Complete the current customer first.";

        return;
    }


    message.textContent =
        "Checking queue...";


    try{

        const waiting =
            findWaitingCustomers();


        if(waiting.length === 0){

            message.textContent =
                "No customers waiting.";

            return;
        }


        let claimed = null;


        for(
            const ticket of waiting
        ){

            claimed =
                await claimTicket(ticket);

            if(claimed){
                break;
            }
        }


        if(!claimed){

            message.textContent =
                "No customers waiting.";

            return;
        }


        await announceCustomer(
            claimed
        );


        message.textContent =
            claimed.number +
            " called.";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Unable to access queue.";
    }
}


/* =====================================================
   ANNOUNCE CLAIMED CUSTOMER
===================================================== */

async function announceCustomer(ticket){

    const tellerData = {

        number:
            ticket.number,

        prefix:
            ticket.prefix || "",

        service:
            ticket.service || "",

        queueKey:
            ticket.key,

        teller:
            TELLER_NUMBER,

        calledAt:
            ticket.calledAt ||
            Date.now()

    };


    await set(
        ref(
            db,
            "tellers/teller1"
        ),
        tellerData
    );


    await set(
        ref(
            db,
            "display/current"
        ),
        tellerData
    );


    await push(
        ref(
            db,
            "display/history"
        ),
        tellerData
    );
}


/* =====================================================
   RECALL CUSTOMER
===================================================== */

async function recallCustomer(){

    if(
        !connected ||
        !authenticated
    ){

        message.textContent =
            "Queue connection is unavailable.";

        return;
    }


    if(!currentTicket){

        message.textContent =
            "No customer to recall.";

        return;
    }


    try{

        const recallData = {

            ...currentTicket,

            teller:
                TELLER_NUMBER,

            recalledAt:
                Date.now()

        };


        await set(
            ref(
                db,
                "display/current"
            ),
            recallData
        );


        await push(
            ref(
                db,
                "display/history"
            ),
            recallData
        );


        message.textContent =
            currentTicket.number +
            " recalled.";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Unable to recall customer.";
    }
}


/* =====================================================
   COMPLETE CUSTOMER
===================================================== */

async function completeCustomer(){

    if(
        !connected ||
        !authenticated
    ){

        message.textContent =
            "Queue connection is unavailable.";

        return;
    }


    if(!currentTicket){

        message.textContent =
            "No customer to complete.";

        return;
    }


    try{

        const completedNumber =
            currentTicket.number;


        if(currentQueueKey){

            await update(
                ref(
                    db,
                    "queue/" +
                    currentQueueKey
                ),
                {
                    status:"complete",
                    completedAt:Date.now()
                }
            );
        }


        await set(
            ref(
                db,
                "tellers/teller1"
            ),
            null
        );


        currentTicket = null;
        currentQueueKey = null;


        currentNumber.textContent =
            "---";


        currentService.textContent =
            "No customer currently assigned.";


        message.textContent =
            completedNumber +
            " completed.";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Unable to complete customer.";
    }
}


/* =====================================================
   FAST TOUCH BUTTONS
===================================================== */

function fastButton(
    element,
    action
){

    element.addEventListener(
        "pointerdown",
        async function(event){

            event.preventDefault();


            if(
                touchLock ||
                element.disabled
            ){
                return;
            }


            touchLock = true;


            try{

                await action();

            }
            finally{

                setTimeout(
                    function(){

                        touchLock = false;

                    },
                    400
                );
            }
        },
        {
            passive:false
        }
    );
}


fastButton(
    nextButton,
    getNextCustomer
);

fastButton(
    recallButton,
    recallCustomer
);

fastButton(
    completeButton,
    completeCustomer
);


/* =====================================================
   DISABLE LONG PRESS / COPY
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event){
        event.preventDefault();
    }
);

document.addEventListener(
    "selectstart",
    function(event){
        event.preventDefault();
    }
);

</script>

</body>
</html>
